[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathviz"
version = "0.2.0"
description = "MathViz — 从数学问题到教学动画的 AI 流水线。输入问题，输出可编辑的 Manim 动画。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gakiwoo and MathViz contributors" }]
dependencies = [
  "openai-agents>=0.3.3",
  "pydantic>=1.10,<3",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=4",
  "ruff>=0.4",
]
render = [
  "manim>=0.19",
]
web = [
  "fastapi>=0.110",
  "gradio>=4",
  "httpx>=0.27",
  "uvicorn>=0.29",
]

[project.scripts]
mathviz = "math_to_manim.cli:main"
math-to-manim = "math_to_manim.cli:main"
m2m2 = "math_to_manim.cli:main"

[tool.setuptools.packages.find]
include = ["math_to_manim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N812"]  # allow long lines (handled by formatter); allow lowercase imported as

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["math_to_manim"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 1
skip_covered = false
skip_empty = true
sort = "Cover"
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
