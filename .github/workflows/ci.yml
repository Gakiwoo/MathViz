name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          python -m ruff check math_to_manim/ tests/

      - name: Check formatting
        run: |
          python -m ruff format --check math_to_manim/ tests/

      - name: Test with coverage
        run: |
          python -m coverage run -m pytest tests/ -q
          python -m coverage report --fail-under=85

      - name: CLI smoke test (deterministic)
        run: |
          python -m math_to_manim.cli generate "Explain what a derivative is" --deterministic --no-render --runs-dir /tmp/m2m2-ci-smoke
